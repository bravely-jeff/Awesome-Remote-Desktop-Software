<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: #0a0e17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlow2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatBeam {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitNode {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(180deg); }
        100% { transform: translateY(0px) rotate(360deg); }
      }
      @keyframes radarSweep {
        0% { opacity: 0.2; transform: rotate(0deg); transform-origin: 1040px 170px; }
        50% { opacity: 0.55; }
        100% { opacity: 0.2; transform: rotate(360deg); transform-origin: 1040px 170px; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .anim-glow1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 120px; }
      .anim-glow2 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 950px 220px; }
      .data-stream { stroke-dasharray: 20, 160; animation: floatBeam 8s linear infinite; }
      .data-stream-fast { stroke-dasharray: 40, 200; animation: floatBeam 5s linear infinite; }
      .radar-sweep { animation: radarSweep 10s linear infinite; }
      .pill-hover { animation: floatPill 4s ease-in-out infinite; }
      .pill-delay { animation: floatPill 4s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs (Dynamic Aspect in Background) -->
  <circle cx="180" cy="110" r="260" fill="url(#meshGlow1)" class="anim-glow1" />
  <circle cx="1020" cy="220" r="280" fill="url(#meshGlow2)" class="anim-glow2" />

  <!-- Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Dynamic Network Stream Lines in Background -->
  <g fill="none" stroke-width="1.8" stroke-linecap="round">
    <!-- Stream 1 -->
    <path d="M -50 140 Q 300 240 650 100 T 1250 160" stroke="#0284c7" stroke-opacity="0.25" />
    <path d="M -50 140 Q 300 240 650 100 T 1250 160" stroke="#38bdf8" stroke-opacity="0.85" class="data-stream" />

    <!-- Stream 2 -->
    <path d="M -20 220 Q 350 70 800 270 T 1250 110" stroke="#7c3aed" stroke-opacity="0.25" />
    <path d="M -20 220 Q 350 70 800 270 T 1250 110" stroke="#c084fc" stroke-opacity="0.85" class="data-stream-fast" />
  </g>

  <!-- Interactive Graphic: Left Remote Desktop Terminal Node -->
  <g transform="translate(70, 75)" filter="url(#subtleShadow)">
    <rect width="130" height="90" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="8" y="8" width="114" height="14" rx="3" fill="#1e293b" />
    <circle cx="16" cy="15" r="3" fill="#ef4444" />
    <circle cx="25" cy="15" r="3" fill="#eab308" />
    <circle cx="34" cy="15" r="3" fill="#22c55e" />
    <line x1="14" y1="35" x2="70" y2="35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="46" x2="105" y2="46" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="56" x2="88" y2="56" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="67" x2="50" y2="67" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
    <!-- Stand -->
    <path d="M 55 90 L 50 106 L 80 106 L 75 90" fill="#334155" />
    <rect x="42" y="106" width="46" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Interactive Graphic: Right Host Server Node -->
  <g transform="translate(1010, 75)" filter="url(#subtleShadow)">
    <rect width="120" height="100" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="10" y="12" width="100" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="22" r="3" fill="#22c55e" />
    <line x1="32" y1="22" x2="65" y2="22" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <rect x="10" y="40" width="100" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="50" r="3" fill="#38bdf8" />
    <line x1="32" y1="50" x2="80" y2="50" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <rect x="10" y="68" width="100" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="78" r="3" fill="#c084fc" />
    <line x1="32" y1="78" x2="55" y2="78" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, and Feature Badges (Always crisp and fully visible) -->
  <g id="foreground" filter="url(#subtleShadow)">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 52)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="-112" cy="0" r="4" fill="#38bdf8" />
      <text x="5" y="4.5" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="120" text-anchor="middle" font-size="40" font-weight="900" fill="url(#primaryGrad)" letter-spacing="0.5">
      Remote Desktop Software
    </text>

    <!-- Subtitle -->
    <text x="600" y="158" text-anchor="middle" font-size="16.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      High-Performance RDP • VNC • WebRTC • Self-Hosted Sovereignty • Enterprise Support
    </text>

    <!-- Foreground Feature Pills (Elevated & Positioned cleanly at bottom) -->
    <g transform="translate(600, 235)">
      <!-- Pill 1: Self-Hosted -->
      <g transform="translate(-375, 0)" class="pill-hover">
        <rect x="0" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="24" y="26" font-size="16">🏠</text>
        <text x="52" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Self-Hosted Focus</text>
      </g>

      <!-- Pill 2: Ultra Low Latency -->
      <g transform="translate(-185, 0)" class="pill-delay">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="22" y="26" font-size="16">⚡</text>
        <text x="50" y="26" fill="#f1f5f9" font-size="13" font-weight="600">60 FPS Low Latency</text>
      </g>

      <!-- Pill 3: Enterprise Security -->
      <g transform="translate(10, 0)" class="pill-hover">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="22" y="26" font-size="16">🛡️</text>
        <text x="50" y="26" fill="#f1f5f9" font-size="13" font-weight="600">E2E Zero-Trust</text>
      </g>

      <!-- Pill 4: Cross-Platform -->
      <g transform="translate(205, 0)" class="pill-delay">
        <rect x="0" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
        <text x="22" y="26" font-size="16">🌐</text>
        <text x="50" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Cross-Platform</text>
      </g>
    </g>

    <!-- Bottom Tech Tags -->
    <text x="600" y="306" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      RUSTDESK • GUACAMOLE • ANYDESK • TEAMVIEWER • FREERDP • SUNSHINE • NO-VNC • SCRCPY • MESH-CENTRAL
    </text>
  </g>
</svg>
